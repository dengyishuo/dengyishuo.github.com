# 作品页数据
# role: 译 / 著
# status: published（已出版）/ writing（撰写中）/ planned（计划内）
# desc: 主要内容  suit: 适合谁读  note: 备注（可空）  url: 外链（可空）

books:
  - title: R语言核心技术手册
    role: 译
    status: published
    desc: 从安装 R 讲到拟合模型、画图，6 部分 26 章铺满语法、数据结构、数据导入与清洗、字符串与日期处理、统计建模、绘图，以及包的查找与扩展。定位是"随时查得到、拿来就能用"的工具书，而不是从头读到尾的教程。
    suit: 有编程基础、把 R 当主力工具的分析师和数据科学从业者；需要一本案头参考随时翻的人。完全没有编程经验的话，读起来会偏快。
    note: 原书 R in a Nutshell
    url: ""

  - title: R数据可视化手册
    role: 译
    status: published
    desc: 以「问题—解法」组织的手册：条形图、折线图、散点图、箱线图、直方图与密度曲线、误差棒，以及坐标轴、图例、注释、配色、主题与多图排版。ggplot2 与基础绘图两套体系都覆盖，遇到具体图形直接检索对应条目。
    suit: 需要把分析结果做成规范图表的分析师和研究生；被"图不好看、细节调不动"困住的 R 用户。当工具书翻，不适合当教材通读。
    note: 原书 R Graphics Cookbook
    url: ""

  - title: R语言统计入门
    role: 译
    status: published
    desc: 用 R 讲统计，而不是用统计讲 R。前半本铺 R 的编程与数据处理，后半本进入具体方法：t 检验、方差分析、列联表、回归、广义线性模型、非线性拟合、生存分析。每章配 ISwR 数据集与习题，代码可直接复现。
    suit: 统计零基础但需要用 R 做分析的人；在校学生当教材用，从业者用来补统计底子。已经要做复杂机器学习建模的读者，会觉得深度不够。
    note: 原书 Introductory Statistics with R
    url: ""

  - title: 量化交易与R语言
    role: 译
    status: published
    desc: 一位高频交易员的实操路线。先讲交易在做什么、需要哪些工具，再从线性代数、概率统计过渡到价差、Beta 与风险敞口；随后用 quantstrat 搭建回测、处理高频数据、给期权定价、做参数优化，最后落在运行速度、测试与结果呈现上。
    suit: 想把策略从想法一路跑到回测的量化入门者与个人交易者；学过一点统计、会写脚本，但缺完整工程流程的人。
    note: 原书 Quantitative Trading with R
    url: ""

  - title: 金融风险建模及投资组合优化：使用R语言
    role: 译
    status: published
    desc: 偏数理的一本。风险侧讲损失函数与风险度量、条件与无条件风险建模、极值理论、广义双曲分布、波动率模型（GARCH 族）与刻画相依结构的 Copula；组合侧讲带风险约束的优化，含均值—方差与 CVaR 一类目标。书中结论都附可复现的 R 代码。
    suit: 风控、资产配置、量化研究岗位的从业者；金融数学、金融工程、统计学方向的研究生。需要概率统计与微积分基础，不适合零基础入门。
    note: 原书 Financial Risk Modelling and Portfolio Optimization with R
    url: ""

  - title: AI时代R与技术分析全景应用指南
    role: 著
    status: writing
    desc: 计划把技术分析从「指标公式」推到「可检验的系统」：K 线与量价关系的精确定义、趋势／摆动／量能三类指标族的实现与参数稳健性、信号有效性的统计检验，以及用 AI 辅助生成、筛选和复核交易规则。
    suit: 有 R 基础、想认真做策略研究而不是背指标口诀的量化入门者与个人交易者。
    note: ""
    url: ""

  - title: AI时代R与蜡烛图分析全景应用指南
    role: 著
    status: planned
    desc: 只讲蜡烛图一件事，但讲透：形态如何被定义成可计算的条件、识别算法的实现与常见的误判来源、形态出现之后的收益分布与统计显著性，以及它与现代指标、量价因子如何配合使用。
    suit: 对形态学有兴趣、但不想停留在「看图说话」的技术分析使用者和研究者。
    note: ""
    url: ""

  - title: AI时代R与量化投资全景应用指南
    role: 著
    status: planned
    desc: 打算写一条完整链路：数据基础设施与清洗、因子构造与检验、组合构建与优化、回测框架与过拟合防范、实盘执行与运行监控，以及每一步在 R 里究竟怎么落地。
    suit: 想从「会写单个策略」走到「有一套完整研究流程」的从业者；量化团队里负责搭基础设施的人。
    note: ""
    url: ""

  - title: AI时代R与金融数据可视化全景应用指南
    role: 著
    status: planned
    desc: 金融数据的可视化方法论：时间序列与多资产对比、横截面与排序、分布与关系、网络与流向、交互式图表与仪表盘，以及用 AI 加速出图、并判断一张图是否真的说得清。
    suit: 要做研究汇报、投资月报、路演材料的分析师；希望图表能说服人、而不只是好看的人。
    note: ""
    url: ""

