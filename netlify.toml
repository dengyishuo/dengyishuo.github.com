# ============================================================
# 旧分类页 301 跳转
# 2026-11 重构分类：23 个中英混杂分类合并为 6 个中文分类。
# 注意：Netlify 匹配的是**已 URL 编码**的请求路径，所以中文 from
# 必须写成 %XX 形式，写中文明文会匹配不到（实测 404）。
# 文章 permalink 未变，无需跳转。
# ============================================================

