{{- /* 格物堂 · 作品页（文本列表版，无卡片） */ -}}
{{ define "body-class" }}gt-works-page{{ end }}

{{ define "main" }}
    <header class="gt-page-head">
        <h1 class="gt-page-title">{{ .Title }}</h1>
        {{- with .Params.description }}<p class="gt-page-desc">{{ . }}</p>{{ end }}
    </header>

    {{ .Content }}

    <div class="gt-works-body">
        {{ partial "works/list" . }}
    </div>

    {{ partial "footer/footer" . }}
{{ end }}

{{ define "right-sidebar" }}{{ end }}
