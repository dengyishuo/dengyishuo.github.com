baseURL: "https://gewutang.cn/"
title: 格物堂
theme: hugo-theme-stack
locale: zh-cn
defaultContentLanguage: zh-cn
hasCJKLanguage: true

security:
  allowContent:
    - "text/html"
    - "text/markdown"
    - "text/org"

# R 源码不进构建产物。Hugo 会把 bundle 里非内容文件当页面资源发布，
# 不加这条 index.Rmd 会被复制到 public/ 下，任何人都能直接从站上下载。
# 只影响构建产物，本地文件和 git 里的 Rmd 不受影响。
ignoreFiles:
  - '(?i)\.rmd$'
  - '(?i)\.rmd\.lock~$'

pagination:
  pagerSize: 12

permalinks:
  blog: /:year/:month/:day/:slug/
  page: /:slug/

taxonomies:
  category: categories
  tag: tags

# 搜索页需要 json 输出（用于前端索引）；不在单页 front matter 里写 outputs，
# 那会触发 Hugo 0.170 的 shiftToOutputFormat panic。
outputs:
  page:
    - HTML
    - JSON
  section:
    - HTML
    - RSS

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    # 打开围栏代码块的语法高亮（原来 false，代码全无颜色）
    # noClasses: false 表示输出 class 而非内联样式，
    # 配色表在 assets/scss/_chroma.scss（由 custom.scss 引入）
    codeFences: true
    noClasses: false
    style: friendly
    lineNos: false
    tabWidth: 4
  tableOfContents:
    startLevel: 2
    endLevel: 4

params:
  mainSections:
    - blog
  rssFullContent: true
  favicon: "images/favicon.ico"
  dateFormat:
    published: "2006-01-02"
    lastUpdated: "2006-01-02"

  sidebar:
    subtitle: 让知识美好生活
    avatar: "images/avatar.png"

  article:
    headingAnchor: true
    math: true
    toc: true
    readingTime: true
    list:
      # 卡片流不显示标签，只在文章正文页显示
      showTags: false
    license:
      enabled: false

  footer:
    since: 2010
    customText: "让知识美好生活"

  widgets:
    homepage:
      - type: search
      - type: archives
        params:
          # 默认只露前 3 年，其余收进「更多」
          limit: 3
      - type: categories
        params:
          limit: 12
      - type: tag-cloud
        params:
          limit: 20
    page:
      - type: toc

menu:
  main:
    - identifier: home
      name: 首页
      url: /
      weight: 1
      params:
        icon: home
    - identifier: blog
      name: 博客
      url: /blog/
      weight: 2
      params:
        icon: archives
    - identifier: works
      name: 作品
      url: /works/
      weight: 3
      params:
        icon: hash
    - identifier: about
      name: 关于我
      url: /about/
      weight: 4
      params:
        icon: user
    - identifier: links
      name: 友情链接
      url: /links/
      weight: 5
      params:
        icon: link

  social:
    - identifier: github
      name: GitHub
      url: "https://github.com/dengyishuo"
      params:
        icon: brand-github
